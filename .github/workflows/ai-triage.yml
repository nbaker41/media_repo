name: AI Issue Triage
on:
  issues:
    types: [opened,labeled] # Triggers when you add a specific label

jobs:
  triage:
    if: github.event.label.name == 'request ai review' # Only runs if this label is added
    runs-on: ubuntu-latest
    concurrency:
      group: triage-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read # Required to checkout the code
      issues: write   # Required to post comments and add labels
      models: read   
    outputs:
      assessment: ${{ steps.ai.outputs.comment }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: AI Assessment Comment Labeler
        uses: github/ai-assessment-comment-labeler@v1.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ai_review_label: 'request ai review'
          issue_number: ${{ github.event.issue.number }}
          issue_body: "Title: ${{ github.event.issue.title }}\n\n${{ github.event.issue.body }}"
          # Path where you store your AI instructions (see note below)
          prompts_directory: './.github/prompts'
          # Maps the trigger label to a specific prompt instruction file
          labels_to_prompts_mapping: 'request ai review,triage.prompt.yml'
          
      - name: Apply Priority Label
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `${{ steps.ai.outputs.comment }}`;
            const match = comment.match(/### Priority: (priority: (?:high|medium|low))/i);
            if (match) {
              await github.rest.issues.addLabels({
                issue_number: ${{ github.event.issue.number }},
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: [match[1]]
              });
            }
  post-comment:
    needs: triage
    runs-on: ubuntu-latest
    environment: triage-approval
    permissions:
      issues: write
    steps:
      - name: Post AI Comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ github.event.issue.number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${{ needs.triage.outputs.assessment }}`
            })